<svg viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline: 2025 Foundation, 2025-2026 Deep Learning, 2026 Flagship Systems &amp; Hackathons, Shipping Ahead">
  <style>
    :root {
      --bone: #111111;
      --rule: #D0D0D0;
      --muted: #555555;
      --dim: #777777;
      --accent: #111111;
      --node-bg: #F8F9FA;
      --core-bg: #EEEEEE;
      --ghost: #000000;
      --ink: #111111;
      --paper: #FFFFFF;
    }

    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: d 1.6s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    .fade { opacity: 0; animation: f .8s ease forwards; }
    @keyframes f { to { opacity: 1; } }
    .t1{animation-delay:.3s} .t2{animation-delay:.6s} .t3{animation-delay:.9s} .t4{animation-delay:.1.2s} .t5{animation-delay:1.5s}
    @media (prefers-reduced-motion: reduce) {
      .draw,.fade { animation: none; } .draw { stroke-dashoffset: 0; } .fade { opacity: 1; }
    }
  </style>

  <line x1="48" y1="40" x2="1152" y2="40" stroke="var(--rule)"/>
  <text fill="var(--muted)" class="mono" x="48" y="28" font-size="11" letter-spacing="3.5">THE ROUTE SO FAR</text>
  <text fill="var(--muted)" class="mono" x="1152" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 03</text>

  <!-- main horizontal axis -->
  <line class="draw" x1="48" y1="125" x2="1152" y2="125" stroke="var(--rule)" stroke-width="1.5"/>

  <!-- nodes & branches -->
  <!-- 2025: College -->
  <g class="fade t1">
    <line x1="100" y1="125" x2="100" y2="95" stroke="var(--rule)" stroke-width="1"/>
    <circle cx="100" cy="125" r="4" fill="var(--accent)"/>
    <text fill="var(--accent)" class="mono" x="100" y="74" font-size="11" letter-spacing="2" text-anchor="middle">2025</text>
    <text fill="var(--bone)" class="mono" x="100" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">B.Tech CSE (Data Science)</text>
  </g>

  <!-- 2025: Foundation -->
  <g class="fade t2">
    <line x1="310" y1="125" x2="310" y2="155" stroke="var(--rule)" stroke-width="1"/>
    <circle cx="310" cy="125" r="4" fill="var(--accent)"/>
    <text fill="var(--accent)" class="mono" x="310" y="172" font-size="11" letter-spacing="2" text-anchor="middle">2025</text>
    <text fill="var(--bone)" class="mono" x="310" y="188" font-size="10.5" letter-spacing="1" text-anchor="middle">Python &#183; NumPy &#183; scikit-learn</text>
  </g>

  <!-- 2026: Deep Learning -->
  <g class="fade t3">
    <line x1="520" y1="125" x2="520" y2="95" stroke="var(--rule)" stroke-width="1"/>
    <circle cx="520" cy="125" r="4" fill="var(--accent)"/>
    <text fill="var(--accent)" class="mono" x="520" y="74" font-size="11" letter-spacing="2" text-anchor="middle">2026</text>
    <text fill="var(--bone)" class="mono" x="520" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">Deep Learning from Scratch &#183; CNNs &#183; LSTMs</text>
  </g>

  <!-- 2026: Autonomous Systems -->
  <g class="fade t4">
    <line x1="730" y1="125" x2="730" y2="155" stroke="var(--rule)" stroke-width="1"/>
    <circle cx="730" cy="125" r="4" fill="var(--accent)"/>
    <text fill="var(--accent)" class="mono" x="730" y="172" font-size="11" letter-spacing="2" text-anchor="middle">2026</text>
    <text fill="var(--bone)" class="mono" x="730" y="188" font-size="10.5" letter-spacing="1" text-anchor="middle">VALENS.AI &#183; CyberShield &#183; FastAPI &#183; RAG</text>
  </g>

  <!-- NOW: Production Engineering -->
  <g class="fade t5">
    <line x1="920" y1="125" x2="920" y2="95" stroke="var(--rule)" stroke-width="1"/>
    <circle cx="920" cy="125" r="5" fill="var(--bone)"/>
    <text fill="var(--accent)" class="mono" x="920" y="74" font-size="11" letter-spacing="2" text-anchor="middle">NOW</text>
    <text fill="var(--bone)" class="mono" x="920" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">Production Systems &#183; Hackathons</text>
  </g>

  <!-- horizon -->
  <text fill="var(--dim)" class="mono" x="1152" y="105" font-size="10" letter-spacing="2" text-anchor="end">2029 &#8594;</text>
  <text fill="var(--dim)" class="mono" x="1152" y="150" font-size="13" text-anchor="end">the frontier</text>
</svg>
