<svg viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Harkirat Singh Saggar &#8212; Machine Learning &amp; AI Systems Engineer">
  <style>
    :root {
      --bone: #111111;
      --rule: #D0D0D0;
      --muted: #555555;
      --dim: #777777;
      --accent: #222222;
      --node-bg: #F8F9FA;
      --core-bg: #EEEEEE;
      --ghost: #CCCCCC;
      --ink: #111111;
      --paper: #FFFFFF;
    }

    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(12px); } to { opacity:1;transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.2s} .a2{animation-delay:.5s} .a3{animation-delay:.9s} .a4{animation-delay:1.2s} .a5{animation-delay:1.4s} .a6{animation-delay:1.7s}
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.fade { animation: none; }
      .draw{stroke-dashoffset:0} .rise,.fade{opacity:1}
    }
  </style>

  <line class="draw a1" x1="48" y1="58" x2="952" y2="58" stroke="var(--rule)" stroke-width="1"/>
  <g class="fade a1">
    <text class="mono" fill="var(--muted)" x="48" y="44" font-size="11" letter-spacing="3.5">PORTFOLIO &#8212; INDEX N&#186; 001</text>
    <text class="mono" fill="var(--muted)" x="952" y="44" font-size="11" letter-spacing="3.5" text-anchor="end">KOLKATA, IN &#8212; DATA SCIENCE &amp; AI</text>
  </g>

  <g class="rise a2">
    <text fill="var(--bone)" class="mono" x="46" y="176" font-size="72" letter-spacing="-2">Harkirat Singh Saggar</text>
  </g>
  <g class="fade a3">
    <text fill="var(--muted)" class="mono" x="48" y="214" font-size="19">Data Science, Deep Learning &amp; AI Systems &#8212; Kolkata, India.</text>
  </g>

  <g class="fade a4">
    <text fill="var(--dim)" class="mono" x="48" y="274" font-size="12.5" letter-spacing="1">focus  &#9656;</text>
    <text fill="var(--accent)" class="mono" x="128" y="274" font-size="12.5" letter-spacing="1">autonomous cyber-deception &#183; deep neural nets &#183; ML systems &#183; APIs</text>
  </g>
  <g class="fade a5">
    <text fill="var(--dim)" class="mono" x="48" y="300" font-size="12.5" letter-spacing="1">building flagship architectures &#183; hackathons &#183; open to collaboration</text>
  </g>

  <line class="draw a5" x1="48" y1="342" x2="952" y2="342" stroke="var(--rule)" stroke-width="1"/>
  <g class="fade a6">
    <text fill="var(--muted)" class="mono" x="48" y="374" font-size="11.5" letter-spacing="3">MACHINE LEARNING</text>
    <text fill="var(--accent)" class="mono" x="252" y="374" font-size="11.5">&#183;</text>
    <text fill="var(--muted)" class="mono" x="282" y="374" font-size="11.5" letter-spacing="3">DEEP LEARNING</text>
    <text fill="var(--accent)" class="mono" x="520" y="374" font-size="11.5">&#183;</text>
    <text fill="var(--muted)" class="mono" x="550" y="374" font-size="11.5" letter-spacing="3">AI &amp; CYBER-DEFENSE</text>
    <text fill="var(--muted)" class="mono" x="952" y="374" font-size="11.5" letter-spacing="3" text-anchor="end">NARULA &#8212; 2025 / 2029</text>
  </g>
</svg>
