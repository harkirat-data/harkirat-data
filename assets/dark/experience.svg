<svg viewBox="0 0 1000 370" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Experience &#8212; Flagship Systems, Deep Learning, Classical ML, Narula Institute of Technology">
  <style>
    :root {
      --bone: #F5F5F5;
      --rule: #333333;
      --muted: #AAAAAA;
      --dim: #888888;
      --accent: #FFFFFF;
      --node-bg: #141414;
      --core-bg: #1F1F1F;
      --ghost: #FFFFFF;
      --ink: #FFFFFF;
      --paper: #000000;
    }

    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s} .a4{animation-delay:.75s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>

  <line x1="120" y1="10" x2="120" y2="360" stroke="var(--rule)" stroke-width="1" opacity=".4"/>

  <g class="rise a1">
    <text class="mono" x="48" y="42"  font-size="12" fill="var(--accent)" letter-spacing="2">2026</text>
    <text class="mono" x="136" y="42"  font-size="15" fill="var(--bone)">AUTONOMOUS AI &amp; CYBER-DECEPTION SYSTEMS</text>
    <text class="mono" x="136" y="68"  font-size="14" fill="var(--muted)">VALENS.AI &#183; CyberShield &#183; HoneyToken canary traps &#183; real-time MITRE ATT&amp;CK mapping</text>
    <text class="mono" x="136" y="90"  font-size="14" fill="var(--muted)">WebSocket telemetry streaming &#183; automated WAF auto-ban &#183; RAG incident triage</text>
  </g>

  <g class="rise a2">
    <text class="mono" x="48" y="138" font-size="12" fill="var(--accent)" letter-spacing="2">2026</text>
    <text class="mono" x="136" y="138" font-size="15" fill="var(--bone)">DEEP LEARNING &amp; NEURAL ARCHITECTURES</text>
    <text class="mono" x="136" y="164" font-size="14" fill="var(--muted)">NumPy neural net from scratch &#183; Keras Tuner hyperparameter exploration &#183; CNN / LeNet-5</text>
    <text class="mono" x="136" y="186" font-size="14" fill="var(--muted)">LSTM Next-Word Predictor &#183; sequence-to-sequence encoder-decoder &#183; transfer learning</text>
  </g>

  <g class="rise a3">
    <text class="mono" x="48" y="234" font-size="12" fill="var(--accent)" letter-spacing="2">2025</text>
    <text class="mono" x="136" y="234" font-size="15" fill="var(--bone)">MACHINE LEARNING &amp; MICROSERVICES</text>
    <text class="mono" x="136" y="260" font-size="14" fill="var(--muted)">Production APIs with FastAPI &amp; Pydantic &#183; asynchronous model serving endpoints</text>
    <text class="mono" x="136" y="282" font-size="14" fill="var(--muted)">PCA &#183; SVM kernels &#183; customer churn classification &#183; silhouette clustering pipelines</text>
  </g>

  <g class="rise a4">
    <text class="mono" x="48" y="330" font-size="12" fill="var(--accent)" letter-spacing="2">2025 &#8211;</text>
    <text class="mono" x="136" y="330" font-size="15" fill="var(--bone)">Narula Institute of Technology &#183; B.Tech CSE (Data Science)</text>
    <text class="mono" x="136" y="356" font-size="14" fill="var(--muted)">Honors coursework in Algorithms, Machine Learning Systems &amp; Open-Source Engineering</text>
  </g>
</svg>
