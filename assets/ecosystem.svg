<svg viewBox="0 0 1000 680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="System map: end-to-end architectures &#8212; deep learning, autonomous systems, classical ML, production APIs">
  <style>
    :root {
      --bone: #111111;
      --rule: #D0D0D0;
      --muted: #555555;
      --dim: #777777;
      --accent: #111111;
      --node-bg: #F8F9FA;
      --core-bg: #EEEEEE;
      --ghost: #000000;
      --ink: #111111;
      --paper: #FFFFFF;
    }

    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .node  { fill: var(--node-bg); stroke: var(--rule); stroke-width: 1; }
    .nodeC { fill: var(--core-bg); stroke: var(--bone); stroke-width: 1.5; }
    .wire  { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 4 4; }
    .flow  { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 6 18; animation: flow 3s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    .pop { opacity: 0; animation: pop .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes pop { from { opacity:0;transform:scale(.95); } to { opacity:1;transform:scale(1); } }
    .p0{transform-origin:500px 280px;animation-delay:.1s}
    .p1{transform-origin:165px 165px;animation-delay:.25s}
    .p2{transform-origin:120px 295px;animation-delay:.35s}
    .p3{transform-origin:175px 415px;animation-delay:.45s}
    .p4{transform-origin:390px 103px;animation-delay:.3s}
    .p5{transform-origin:635px 110px;animation-delay:.4s}
    .p6{transform-origin:845px 185px;animation-delay:.5s}
    .p7{transform-origin:850px 320px;animation-delay:.6s}
    .p8{transform-origin:360px 465px;animation-delay:.55s}
    .p9{transform-origin:720px 420px;animation-delay:.65s}
    .p11{transform-origin:190px 581px;animation-delay:.7s}
    .p12{transform-origin:500px 552px;animation-delay:.75s}
    .p13{transform-origin:810px 581px;animation-delay:.8s}
    @media (prefers-reduced-motion: reduce) {
      .flow,.pop { animation: none; } .pop { opacity: 1; }
    }
  </style>

  <defs>
    <mask id="node-cutouts">
      <rect width="1000" height="680" fill="white"/>
      <rect x="405" y="252" width="190" height="56" fill="black"/>
      <rect x="75"  y="138" width="180" height="54" fill="black"/>
      <rect x="30"  y="268" width="180" height="54" fill="black"/>
      <rect x="85"  y="388" width="180" height="54" fill="black"/>
      <rect x="300" y="76"  width="180" height="54" fill="black"/>
      <rect x="545" y="83"  width="180" height="54" fill="black"/>
      <rect x="755" y="158" width="180" height="54" fill="black"/>
      <rect x="760" y="293" width="180" height="54" fill="black"/>
      <rect x="270" y="438" width="180" height="54" fill="black"/>
      <rect x="630" y="393" width="180" height="54" fill="black"/>
      <rect x="100" y="554" width="180" height="54" fill="black"/>
      <rect x="410" y="525" width="180" height="54" fill="black"/>
      <rect x="720" y="554" width="180" height="54" fill="black"/>
    </mask>
  </defs>

  <line x1="48" y1="40" x2="952" y2="40" stroke="var(--rule)"/>
  <text fill="var(--muted)" class="mono" x="48" y="28" font-size="11" letter-spacing="3.5">SYSTEM MAP &#8212; EVERYTHING FROM ONE PIPELINE</text>
  <text fill="var(--muted)" class="mono" x="952" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 01</text>

  <!-- wires -->
  <g mask="url(#node-cutouts)">
    <line class="wire" x1="419" y1="252" x2="244" y2="192"/>
    <line class="wire" x1="405" y1="284" x2="210" y2="291"/>
    <line class="wire" x1="433" y1="308" x2="240" y2="388"/>
    <line class="wire" x1="483" y1="252" x2="407" y2="130"/>
    <line class="wire" x1="522" y1="252" x2="614" y2="137"/>
    <line class="wire" x1="595" y1="254" x2="755" y2="210"/>
    <line class="wire" x1="595" y1="291" x2="760" y2="310"/>
    <line class="wire" x1="479" y1="308" x2="380" y2="438"/>
    <line class="wire" x1="550" y1="308" x2="678" y2="393"/>
    <line class="wire" x1="471" y1="308" x2="218" y2="554"/>
    <line class="wire" x1="500" y1="308" x2="500" y2="525"/>
    <line class="wire" x1="529" y1="308" x2="782" y2="554"/>
  </g>
  <g mask="url(#node-cutouts)">
    <line class="flow" x1="419" y1="252" x2="244" y2="192"/>
    <line class="flow" x1="405" y1="284" x2="210" y2="291"/>
    <line class="flow" x1="433" y1="308" x2="240" y2="388"/>
    <line class="flow" x1="483" y1="252" x2="407" y2="130"/>
    <line class="flow" x1="522" y1="252" x2="614" y2="137"/>
    <line class="flow" x1="595" y1="254" x2="755" y2="210"/>
    <line class="flow" x1="595" y1="291" x2="760" y2="310"/>
    <line class="flow" x1="479" y1="308" x2="380" y2="438"/>
    <line class="flow" x1="550" y1="308" x2="678" y2="393"/>
    <line class="flow" x1="471" y1="308" x2="218" y2="554"/>
    <line class="flow" x1="500" y1="308" x2="500" y2="525"/>
    <line class="flow" x1="529" y1="308" x2="782" y2="554"/>
  </g>

  <!-- cluster labels -->
  <text fill="var(--accent)" class="mono pop p10" x="165" y="118" font-size="10" letter-spacing="3" text-anchor="middle">DEEP LEARNING</text>
  <text fill="var(--accent)" class="mono pop p10" x="512" y="60"  font-size="10" letter-spacing="3" text-anchor="middle">CYBER-DECEPTION &amp; DEFENSE</text>
  <text fill="var(--accent)" class="mono pop p10" x="845" y="142" font-size="10" letter-spacing="3" text-anchor="middle">DATA SCIENCE &amp; ML</text>
  <text fill="var(--accent)" class="mono pop p10" x="500" y="603" font-size="10" letter-spacing="3" text-anchor="middle">ML SYSTEMS &amp; APIS</text>
  <text fill="var(--accent)" class="mono pop p10" x="500" y="625" font-size="10" letter-spacing="3" text-anchor="middle">PRODUCTION ARCHITECTURES</text>

  <!-- core -->
  <g class="pop p0">
    <rect class="nodeC" x="405" y="252" width="190" height="56" rx="2"/>
    <text fill="var(--bone)" class="mono" x="500" y="276" font-size="13" letter-spacing="2" text-anchor="middle">HARKIRAT.SYS</text>
    <text fill="var(--muted)" class="mono" x="500" y="294" font-size="8.5" letter-spacing="0.5" text-anchor="middle">autonomous engineering pipeline</text>
  </g>

  <!-- nodes -->
  <!-- Top Left: Deep Learning -->
  <g class="pop p1"><rect class="node" x="75" y="138" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="165" y="161" font-size="12" letter-spacing="1" text-anchor="middle">LSTM &amp; Seq Models</text><text fill="var(--muted)" class="mono" x="165" y="180" font-size="9" letter-spacing="1" text-anchor="middle">word predictor · seq2seq</text></g>
  <g class="pop p2"><rect class="node" x="30" y="268" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="120" y="291" font-size="12" letter-spacing="1" text-anchor="middle">Decode Neural Nets</text><text fill="var(--muted)" class="mono" x="120" y="310" font-size="9" letter-spacing="1" text-anchor="middle">NumPy from scratch</text></g>
  <g class="pop p3"><rect class="node" x="85" y="388" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="175" y="411" font-size="12" letter-spacing="1" text-anchor="middle">Computer Vision</text><text fill="var(--muted)" class="mono" x="175" y="430" font-size="9" letter-spacing="1" text-anchor="middle">CNN viz · transfer learning</text></g>

  <!-- Top Center: Flagship Cyber & Defense -->
  <g class="pop p4"><rect class="node" x="300" y="76" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="390" y="99" font-size="12" letter-spacing="1" text-anchor="middle">VALENS.AI Grid</text><text fill="var(--muted)" class="mono" x="390" y="118" font-size="9" letter-spacing="1" text-anchor="middle">MITRE ATT&amp;CK · Canary</text></g>
  <g class="pop p5"><rect class="node" x="545" y="83" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="635" y="106" font-size="12" letter-spacing="1" text-anchor="middle">AI Ticket Analyzer</text><text fill="var(--muted)" class="mono" x="635" y="125" font-size="9" letter-spacing="1" text-anchor="middle">NLP intent · auto-triage</text></g>

  <!-- Right: Classical ML & Tabular -->
  <g class="pop p6"><rect class="node" x="755" y="158" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="845" y="181" font-size="12" letter-spacing="1" text-anchor="middle">Hyperparameter Tuning</text><text fill="var(--muted)" class="mono" x="845" y="200" font-size="9" letter-spacing="1" text-anchor="middle">Keras Tuner · bayesian</text></g>
  <g class="pop p7"><rect class="node" x="760" y="293" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="850" y="316" font-size="12" letter-spacing="1" text-anchor="middle">PCA &amp; SVM Kernels</text><text fill="var(--muted)" class="mono" x="850" y="335" font-size="9" letter-spacing="1" text-anchor="middle">manifold &amp; boundaries</text></g>

  <!-- Mid-Bottom: AI & Tabular Workflows -->
  <g class="pop p8"><rect class="node" x="270" y="438" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="360" y="461" font-size="12" letter-spacing="1" text-anchor="middle">Prescription-AI</text><text fill="var(--muted)" class="mono" x="360" y="480" font-size="9" letter-spacing="1" text-anchor="middle">OCR · healthcare LLM</text></g>
  <g class="pop p9"><rect class="node" x="630" y="393" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="720" y="416" font-size="12" letter-spacing="1" text-anchor="middle">Credit Churn &amp; Clustering</text><text fill="var(--muted)" class="mono" x="720" y="435" font-size="9" letter-spacing="1" text-anchor="middle">SMOTE · silhouette</text></g>

  <!-- Bottom: Systems & APIs -->
  <g class="pop p11"><rect class="node" x="100" y="554" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="190" y="577" font-size="12" letter-spacing="1" text-anchor="middle">FastAPI &amp; Pydantic</text><text fill="var(--muted)" class="mono" x="190" y="596" font-size="9" letter-spacing="1" text-anchor="middle">asynchronous inference</text></g>
  <g class="pop p12"><rect class="node" x="410" y="525" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="500" y="548" font-size="12" letter-spacing="1" text-anchor="middle">RuView Spatial AI</text><text fill="var(--muted)" class="mono" x="500" y="567" font-size="9" letter-spacing="1" text-anchor="middle">WiFi signal analytics</text></g>
  <g class="pop p13"><rect class="node" x="720" y="554" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="810" y="577" font-size="12" letter-spacing="1" text-anchor="middle">MLOps &amp; Docker</text><text fill="var(--muted)" class="mono" x="810" y="596" font-size="9" letter-spacing="1" text-anchor="middle">containerized pipelines</text></g>

  <line x1="48" y1="650" x2="952" y2="650" stroke="var(--rule)"/>
  <text fill="var(--dim)" class="mono" x="952" y="672" font-size="10" letter-spacing="2" text-anchor="end">DASHED LINES &#8212; DATA IN MOTION</text>
</svg>
